name: Update latest.json

on:
  schedule:
    # Every 30 minutes. Scheduled runs can start a few minutes late.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate latest.json
        env:
          PCLOUD_AUTH_TOKEN: ${{ secrets.PCLOUD_AUTH_TOKEN }}
          PCLOUD_USERNAME: ${{ secrets.PCLOUD_USERNAME }}
          PCLOUD_PASSWORD: ${{ secrets.PCLOUD_PASSWORD }}
          PCLOUD_API_HOST: ${{ secrets.PCLOUD_API_HOST }}
        run: |
          export PCLOUD_API_HOST="${PCLOUD_API_HOST:-api.pcloud.com}"
          python update_latest.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --staged --quiet; then
            echo "No changes to latest.json."
          else
            git commit -m "chore: update latest.json"
            git push
          fi
